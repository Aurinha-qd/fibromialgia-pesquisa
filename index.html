<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa: Conhecimento sobre o Manejo da Fibromialgia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta extraída da Logo do Projeto de Fibromialgia */
            --primary: #8b71b8;          /* Roxo Lilás do Laço */
            --primary-dark: #6b5299;     /* Tom mais escuro do roxo */
            --primary-light: #f3eef9;    /* Fundo suave lilás */
            --accent-blue: #0e305e;      /* Azul-marinho da marca */
            --header-bg: #f3eff8;       /* Tom exato do fundo da logo circular do projeto */
            --bg-gradient: linear-gradient(135deg, #f7f5fa 0%, #e9e3f3 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #dcd3eb;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(139, 113, 184, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 760px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid #efe8f8;
            transition: all 0.3s ease;
        }

        /* Banner Superior Lilás com a Logo do Projeto Centralizada */
        .top-banner {
            background-color: var(--header-bg);
            padding: 30px 20px 25px 20px;
            text-align: center;
            border-bottom: 1px solid #e7dff2;
        }

        .logo-projeto-large {
            max-height: 200px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.05));
        }

        /* Corpo do Formulário */
        .card-body {
            padding: 35px 40px 40px 40px;
        }

        /* Logo do UNIPÊ reposicionada na parte de baixo */
        .unipe-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-unipe-down {
            max-height: 42px;
            width: auto;
            object-fit: contain;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border: 1px solid #e3d7f5;
        }

        header h1 {
            font-size: 1.55rem;
            color: var(--accent-blue);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        header h2 {
            font-size: 0.98rem;
            color: var(--primary-dark);
            margin: 0;
            font-weight: 500;
        }

        .step-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .step-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 {
            color: var(--accent-blue);
            font-size: 1.15rem;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .tcle-box {
            background-color: #faf8fd;
            border: 1px solid var(--border);
            padding: 22px;
            height: 260px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.7;
            text-align: justify;
            color: #4b5563;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-size: 0.95rem;
        }

        label.required::after {
            content: " *";
            color: #dc2626;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 113, 184, 0.2);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .option-card {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #fff;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-card input {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        .consent-check {
            background-color: var(--primary-light);
            border: 1px solid #dfd1f4;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .consent-check label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.92rem;
            cursor: pointer;
            font-weight: 500;
            color: var(--primary-dark);
        }

        .consent-check input {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        table.likert-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #fff;
            border-radius: 8px;
