<script>
    function avancarParaFormulario() {
        var checkbox = document.getElementById('check-concordo');
        if (!checkbox || !checkbox.checked) {
            alert('Por favor, marque a caixa de seleção para confirmar que aceita o TCLE antes de prosseguir.');
            return;
        }

        // Esconde a div do TCLE e exibe o formulário de perguntas
        document.getElementById('step-tcle').style.display = 'none';
        document.getElementById('form-pesquisa').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function enviarFormulario(event) {
        event.preventDefault();

        var btnSubmit = event.target.querySelector('button[type="submit"]');
        btnSubmit.disabled = true;
        btnSubmit.textContent = "Enviando respostas...";

        var formData = new FormData(event.target);
        var dados = Object.fromEntries(formData.entries());

        // Junta as respostas Likert do computador ou celular
        dados.likert_1 = dados.dt_likert_1 || dados.mb_likert_1 || "";
        dados.likert_2 = dados.dt_likert_2 || dados.mb_likert_2 || "";
        dados.likert_3 = dados.dt_likert_3 || dados.mb_likert_3 || "";
        dados.likert_4 = dados.dt_likert_4 || dados.mb_likert_4 || "";
        dados.likert_5 = dados.dt_likert_5 || dados.mb_likert_5 || "";

        if (!dados.likert_1 || !dados.likert_2 || !dados.likert_3 || !dados.likert_4 || !dados.likert_5) {
            alert('Por favor, responda a todas as opções da Questão 22 (Escala Likert) antes de enviar.');
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Enviar Respostas";
            return;
        }

        // URL da API do Google Apps Script com aspas
        var urlAPI = "https://script.google.com/macros/s/AKfycbz-X4XE9Nbn77_XbP1u9vGIOHp-6HEqYj9zpzVpd15oXEe7HS6RHBJSkJjM0Nt4OsM8/exec";

        try {
            await fetch(urlAPI, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            alert("Muito obrigado! Suas respostas foram registradas com sucesso na pesquisa.");
            event.target.reset();
            location.reload();

        } catch (error) {
            console.error("Erro ao enviar:", error);
            alert("Ocorreu um erro ao enviar as respostas. Por favor, tente novamente.");
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Enviar Respostas";
        }
    }
</script>
