<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionário de Pesquisa: Fibromialgia na Formação Acadêmica</title>
</head>
<body>

  <h2>Questionário de Pesquisa: Fibromialgia (FM) na Formação Acadêmica</h2>

  <form action="/enviar-resposta" method="POST">

    <!-- 1. PERFIL SOCIODEMOGRÁFICO -->
    <fieldset>
      <legend><strong>1. Perfil Sociodemográfico</strong></legend>
      <br>

      <div>
        <label for="idade">Idade (anos):</label><br>
        <input type="number" id="idade" name="idade" min="15" max="100" required>
      </div>
      <br>

      <div>
        <label>Sexo biológico:</label><br>
        <input type="radio" id="sexo_f" name="sexo_biologico" value="feminino" required>
        <label for="sexo_f">Feminino</label><br>
        <input type="radio" id="sexo_m" name="sexo_biologico" value="masculino">
        <label for="sexo_m">Masculino</label>
      </div>
      <br>

      <div>
        <label for="etnia">Raça / Cor / Etnia autodeclarada:</label><br>
        <select id="etnia" name="etnia" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="amarela">Amarela</option>
          <option value="branca">Branca</option>
          <option value="indigena">Indígena</option>
          <option value="parda">Parda</option>
          <option value="preta">Preta</option>
          <option value="outra">Outra / Prefiro não declarar</option>
        </select>
      </div>
      <br>

      <div>
        <label for="estado_civil">Estado civil:</label><br>
        <select id="estado_civil" name="estado_civil" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="solteiro">Solteiro(a)</option>
          <option value="casado_uniao">Casado(a) / União estável</option>
          <option value="divorciado">Divorciado(a) / Separado(a)</option>
          <option value="viuvo">Viúvo(a)</option>
        </select>
      </div>
      <br>

      <div>
        <label for="arranjo_familiar">Número de pessoas residentes no mesmo domicílio (incluindo você):</label><br>
        <input type="number" id="arranjo_familiar" name="arranjo_familiar" min="1" max="20" required>
      </div>
    </fieldset>

    <br>

    <!-- 2. PERFIL SOCIOECONÔMICO -->
    <fieldset>
      <legend><strong>2. Perfil Socioeconômico</strong></legend>
      <br>

      <div>
        <label for="renda_familiar">Renda familiar mensal total (em salários mínimos):</label><br>
        <select id="renda_familiar" name="renda_familiar" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="ate_1_sm">Até 1 salário mínimo</option>
          <option value="1_a_3_sm">De 1 a 3 salários mínimos</option>
          <option value="3_a_5_sm">De 3 a 5 salários mínimos</option>
          <option value="5_a_10_sm">De 5 a 10 salários mínimos</option>
          <option value="mais_10_sm">Mais de 10 salários mínimos</option>
        </select>
      </div>
      <br>

      <div>
        <label for="situacao_laboral">Situação laboral atual (vínculo de trabalho):</label><br>
        <select id="situacao_laboral" name="situacao_laboral" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="apenas_estuda">Apenas estuda</option>
          <option value="estagio_remunerado">Estágio remunerado</option>
          <option value="trabalho_formal">Trabalho formal (CLT/Efetivo)</option>
          <option value="trabalho_informal">Trabalho informal / Autônomo</option>
        </select>
      </div>
    </fieldset>

    <br>

    <!-- 3. TRAJETÓRIA E CONTEXTO ACADÊMICO -->
    <fieldset>
      <legend><strong>3. Trajetória e Contexto Acadêmico</strong></legend>
      <br>

      <div>
        <label for="curso_area">Curso de vinculação atual:</label><br>
        <input type="text" id="curso_area" name="curso_area" placeholder="Ex: Medicina, Enfermagem, Fisioterapia, etc." required>
      </div>
      <br>

      <div>
        <label for="periodo">Período / Semestre letivo atual:</label><br>
        <input type="text" id="periodo" name="periodo" placeholder="Ex: 5º período" required>
      </div>
      <br>

      <div>
        <label for="ciclo_formacao">Ciclo de formação profissional:</label><br>
        <select id="ciclo_formacao" name="ciclo_formacao" required>
          <option value="" disabled selected>Selecione...</option>
          <option value="ciclo_basico">Ciclo Básico</option>
          <option value="ciclo_clinico">Ciclo Clínico / Intermediário</option>
          <option value="internato_estagio">Internato / Estágio Curricular Supervisionado</option>
        </select>
      </div>
      <br>

      <div>
        <label>Possui histórico de trancamentos de curso ou reprovações em disciplinas?</label><br>
        <input type="radio" id="hist_sim" name="historico_trancamento_reprovacao" value="sim" required>
        <label for="hist_sim">Sim</label><br>
