<!-- 4. ABORDAGENS INTEGRADAS E MULTIPROFISSIONAIS -->
    <fieldset>
      <legend><strong>4. Abordagens Integradas e Multiprofissionais</strong></legend>
      <br>

      <div>
        <label>Quais profissionais de saúde compõem o seu acompanhamento regular atualmente? <i>(Pode marcar mais de uma opção)</i></label><br>
        <input type="checkbox" id="prof_reumatologista" name="equipe_saude[]" value="reumatologista">
        <label for="prof_reumatologista">Reumatologista</label><br>

        <input type="checkbox" id="prof_psicologo" name="equipe_saude[]" value="psicologo">
        <label for="prof_psicologo">Psicólogo / Psicoterapeuta</label><br>

        <input type="checkbox" id="prof_fisioterapeuta" name="equipe_saude[]" value="fisioterapeuta">
        <label for="prof_fisioterapeuta">Fisioterapeuta</label><br>

        <input type="checkbox" id="prof_educador_fisico" name="equipe_saude[]" value="educador_fisico">
        <label for="prof_educador_fisico">Educador Físico / Personal Trainer</label><br>

        <input type="checkbox" id="prof_nutricionista" name="equipe_saude[]" value="nutricionista">
        <label for="prof_nutricionista">Nutricionista</label><br>

        <input type="checkbox" id="prof_psiquiatra" name="equipe_saude[]" value="psiquiatra">
        <label for="prof_psiquiatra">Psiquiatra</label><br>

        <input type="checkbox" id="prof_clinico" name="equipe_saude[]" value="clinico_geral">
        <label for="prof_clinico">Clínico Geral / Médico de Família</label><br>

        <input type="checkbox" id="prof_outro" name="equipe_saude[]" value="outro">
        <label for="prof_outro">Outro profissional</label><br>

        <input type="checkbox" id="prof_nenhum" name="equipe_saude[]" value="nenhum">
        <label for="prof_nenhum">Nenhum profissional no momento</label>
      </div>
      <br>

      <div>
        <label for="ajuda_multiprofissional">Em que medida o acompanhamento multiprofissional (fisioterapia, psicologia, atividade física, nutrição) tem ajudado a manter sua rotina acadêmica?</label><br>
        <small>(1 = Nenhuma ajuda / Não realizo | 5 = Ajuda fundamental)</small><br>
        <input type="range" id="ajuda_multiprofissional" name="ajuda_multiprofissional" min="1" max="5" value="3">
      </div>
      <br>

      <div>
        <label>Consegue conciliar as recomendações de autocuidado (exercícios, higiene do sono, alimentação) com as exigências da graduação?</label><br>
        <input type="radio" id="autocuidado_sim_total" name="concilia_autocuidado" value="sim_totalmente" required>
        <label for="autocuidado_sim_total">Sim, totalmente</label><br>

        <input type="radio" id="autocuidado_sim_parcial" name="concilia_autocuidado" value="sim_parcialmente">
        <label for="autocuidado_sim_parcial">Sim, parcialmente (com dificuldades)</label><br>

        <input type="radio" id="autocuidado_nao" name="concilia_autocuidado" value="nao">
        <label for="autocuidado_nao">Não consigo conciliar</label>
      </div>
    </fieldset>
